map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: map
    topic_name: /map
    yaml_filename: artifacts/maps/warehouse_map2/map.yaml

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      allow_unknown: false
      tolerance: 0.20

controller_server:
  ros__parameters:
    odom_topic: /odometry/filtered
    use_sim_time: true
    controller_plugins: [FollowPath]
    goal_checker_plugins: [goal_checker]
    goal_checker:
      plugin: nav2_controller::StoppedGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 3.141592653589793
      trans_stopped_velocity: 0.03
      rot_stopped_velocity: 0.05
      stateful: false
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: -0.25
      max_vel_x: 0.25
      min_vel_y: -0.20
      max_vel_y: 0.20
      max_vel_theta: 0.80
      acc_lim_x: 0.50
      acc_lim_y: 0.50
      acc_lim_theta: 1.00
      decel_lim_x: -0.50
      decel_lim_y: -0.50
      decel_lim_theta: -1.00
      vx_samples: 15
      vy_samples: 15
      vtheta_samples: 20
      sim_time: 1.5
      transform_tolerance: 0.20
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
      critics: [Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.20, 0.14], [0.20, -0.14], [-0.20, -0.14], [-0.20, 0.14]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 0.10
          obstacle_max_range: 3.0
          raytrace_min_range: 0.10
          raytrace_max_range: 3.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.30
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[0.20, 0.14], [0.20, -0.14], [-0.20, -0.14], [-0.20, 0.14]]"
      track_unknown_space: true
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 0.10
          obstacle_max_range: 3.0
          raytrace_min_range: 0.10
          raytrace_max_range: 3.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.30
        cost_scaling_factor: 3.0
