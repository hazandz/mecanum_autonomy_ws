# Static scan contract (not an AMCL parameter): header_frame_id: lidar_frame
amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    scan_topic: /scan
    map_topic: /map
    robot_model_type: nav2_amcl::OmniMotionModel
    tf_broadcast: true
    transform_tolerance: 0.20
    alpha1: 0.20
    alpha2: 0.20
    alpha3: 0.20
    alpha4: 0.20
    alpha5: 0.20
    laser_model_type: likelihood_field
    laser_min_range: -1.0
    laser_max_range: -1.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    sigma_hit: 0.20
    z_hit: 0.50
    z_rand: 0.50
    do_beamskip: false
    update_min_d: 0.05
    update_min_a: 0.10
    set_initial_pose: false
    always_reset_initial_pose: true
    first_map_only: true
