- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
  qos_profile: CLOCK
- ros_topic_name: /scan
  gz_topic_name: /b2/scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
- ros_topic_name: /mecanum/internal/ground_truth/odom
  gz_topic_name: /b2/ground_truth/odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
  qos_profile: DEFAULT
- service_name: /world/b2_training_arena/control
  ros_type_name: ros_gz_interfaces/srv/ControlWorld
  gz_req_type_name: gz.msgs.WorldControl
  gz_rep_type_name: gz.msgs.Boolean
- service_name: /world/b2_training_arena/set_pose
  ros_type_name: ros_gz_interfaces/srv/SetEntityPose
  gz_req_type_name: gz.msgs.Pose
  gz_rep_type_name: gz.msgs.Boolean
- service_name: /world/b2_training_arena/create
  ros_type_name: ros_gz_interfaces/srv/SpawnEntity
  gz_req_type_name: gz.msgs.EntityFactory
  gz_rep_type_name: gz.msgs.Boolean
- service_name: /world/b2_training_arena/remove
  ros_type_name: ros_gz_interfaces/srv/DeleteEntity
  gz_req_type_name: gz.msgs.Entity
  gz_rep_type_name: gz.msgs.Boolean
