# Hardware measurements are deferred to WP12, not sim-eval inputs.
measurement_policy:
  runtime_profile: sim_eval
  measured_hardware_registry: NOT_APPLICABLE_TO_SIM_EVAL
  wp12_deferred_measurements:
    - wheel_radius
    - wheelbase
    - track
    - encoder_scale_and_sign
    - physical_estop
    - mcu_watchdog
    - tb6612_thermal_and_current
    - power_integrity
    - real_braking_and_latency
