runtime:
  runtime_profile: sim_eval
  use_sim_time: true
  allowed_navigation_modes: [NAV2_BASELINE, HYBRID_AI_LOCAL]
motion_limits:
  source_class: SIM_BASELINE
  source_id: sim_eval_nav2_baseline_owner_decision
  max_vx_mps: 0.25
  max_vy_mps: 0.20
  max_wz_radps: 0.80
  acceleration_mps2: [0.50, 0.50, 1.00]
  jerk_mps3: [2.0, 2.0, 4.0]
