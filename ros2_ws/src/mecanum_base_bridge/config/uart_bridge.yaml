mecanum_uart_bridge:
  ros__parameters:
    use_sim_time: false
    serial_device: ""
    hardware_manifest: ""
    heartbeat_topic: /mcu/heartbeat
    lifecycle_timeout_s: 0.6
    # Bench only: empty levels and zero yaw keep teleop disarmed until Owner configures limits.
    slam_bench_yaw_scale_radps: 0.0
    slam_bench_joy_timeout_s: 0.25
